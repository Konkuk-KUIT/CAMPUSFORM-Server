spring:
  application:
    name: CampusFormServer

  # 테스트용 H2 데이터베이스 설정
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  # Google OAuth2 (테스트용 더미 값)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - email
              - profile

# 테스트용 더미 설정
app:
  oauth2:
    login-redirect-uri: http://localhost:3000/auth/callback
    sheets-redirect-uri: http://localhost:3000/oauth/google/callback
